<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. HUD - YouTube Player System</title>
    <style>
        :root {
            --primary-color: #00f3ff;
            --secondary-color: #0066ff;
            --danger-color: #ff3333;
            --bg-color: #050b14;
            --panel-bg: rgba(5, 20, 40, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Consolas, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 80%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        header {
            padding: 15px 20px;
            border-bottom: 2px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            background: rgba(0, 10, 25, 0.8);
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--primary-color);
        }

        .status-bar {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--primary-color);
            box-shadow: 0 0 8px var(--primary-color);
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .hud-panel {
            background: var(--panel-bg);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 15px;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.15), 0 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(5px);
        }

        .panel-header {
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px dashed var(--primary-color);
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        /* Camera Feed Style */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border: 1px solid var(--secondary-color);
            border-radius: 4px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hud-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.2);
        }

        /* Controls & Buttons */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button, input {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        button:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 10px var(--primary-color);
        }

        input[type="text"] {
            flex: 1;
            cursor: text;
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 8px var(--primary-color);
        }

        /* YouTube Player Section */
        .yt-player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            overflow: hidden;
        }

        #youtube-player {
            width: 100%;
            height: 100%;
        }

        .yt-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        /* Command Log Terminal */
        .log-terminal {
            height: 150px;
            background: rgba(0, 5, 10, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.4);
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
            overflow-y: auto;
            color: #00ffaa;
        }

        .log-entry {
            margin-bottom: 4px;
            word-break: break-all;
        }

        .combat-mode {
            --primary-color: #ff3333;
            --secondary-color: #ff9900;
            --panel-bg: rgba(40, 5, 5, 0.75);
        }

        .thermal-mode video {
            filter: invert(100%) hue-rotate(180deg) contrast(200%);
        }
    </style>
</head>
<body>

    <header>
        <div class="title">J.A.R.V.I.S. SYSTEM</div>
        <div class="status-bar">
            <div class="status-item"><div class="indicator"></div> ONLINE</div>
            <div class="status-item"><span id="clock">00:00:00</span></div>
        </div>
    </header>

    <main class="container">
        <!-- Visual & Vision Section -->
        <section class="hud-panel">
            <div class="panel-header">
                <span>Vision & Camera Feed</span>
                <span id="camera-status">DISCONNECTED</span>
            </div>
            <div class="video-container" id="video-wrapper">
                <video id="webcam" autoplay playsinline muted></video>
                <div class="hud-overlay"></div>
            </div>
            <div class="btn-group">
                <button onclick="startCamera()">カメラ起動</button>
                <button onclick="toggleThermal()">サーマル表示</button>
                <button onclick="toggleCombat()">戦闘モード切替</button>
                <button onclick="takeSnapshot()">スナップショット</button>
            </div>
        </section>

        <!-- YouTube Music Subsystem -->
        <section class="hud-panel">
            <div class="panel-header">
                <span>YouTube Media Subsystem</span>
                <span id="yt-status">IDLE</span>
            </div>
            
            <div class="yt-player-wrapper">
                <div id="youtube-player"></div>
            </div>

            <div class="yt-controls">
                <div class="input-row">
                    <input type="text" id="yt-url-input" placeholder="YouTube URLまたは動画IDを入力 (例: dQw4w9WgXcQ)">
                    <button onclick="loadYouTubeVideo()">読み込み</button>
                </div>
                
                <div class="btn-group">
                    <button onclick="playYT()">再生</button>
                    <button onclick="pauseYT()">一時停止</button>
                    <button onclick="stopYT()">停止</button>
                    <button onclick="quickPlay('3L4YrGaR8E4')">BGM 1</button>
                    <button onclick="quickPlay('jfKfPfyJRdk')">BGM 2</button>
                </div>
            </div>
        </section>

        <!-- Voice & Controls Section -->
        <section class="hud-panel">
            <div class="panel-header">Voice Control & Audio Interface</div>
            <div class="btn-group">
                <button id="voice-btn" onclick="toggleVoiceRecognition()">音声認識 開始</button>
                <button onclick="speakJARVIS('システムは正常に動作しています。')">音声テスト</button>
            </div>
            <div style="font-size:0.85rem; color: #88c0d0; margin-top: 5px;">
                コマンド例：「音楽再生」「一時停止」「カメラ起動」「戦闘モード」
            </div>
        </section>

        <!-- Command Log Terminal -->
        <section class="hud-panel">
            <div class="panel-header">System Output Log</div>
            <div class="log-terminal" id="sys-log">
                <div class="log-entry">[SYSTEM] J.A.R.V.I.S. インターフェース初期化完了。</div>
                <div class="log-entry">[SYSTEM] YouTube プレイヤーモジュール待機中...</div>
            </div>
        </section>
    </main>

    <!-- YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // --- System Clock ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ja-JP');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- System Logger ---
        function logMsg(msg) {
            const logBox = document.getElementById('sys-log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timestamp = new Date().toLocaleTimeString('ja-JP');
            entry.innerText = `[${timestamp}] ${msg}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // --- Camera Subsystem ---
        let stream = null;
        async function startCamera() {
            try {
                const video = document.getElementById('webcam');
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
                document.getElementById('camera-status').innerText = 'ACTIVE';
                logMsg('カメラフィードが正常にアクティブ化されました。');
            } catch (err) {
                logMsg('カメラアクセスエラー: ' + err.message);
                alert('カメラの起動に失敗しました。');
            }
        }

        function toggleThermal() {
            const wrapper = document.getElementById('video-wrapper');
            wrapper.classList.toggle('thermal-mode');
            logMsg('サーマルビジョンフィルターの状態を切り替えました。');
        }

        function toggleCombat() {
            document.body.classList.toggle('combat-mode');
            const isCombat = document.body.classList.contains('combat-mode');
            logMsg(isCombat ? '警告: 戦闘モードが有効化されました。' : '通常監視モードに戻りました。');
            speakJARVIS(isCombat ? '戦闘モード、アクティブ。' : '通常モードに復帰します。');
        }

        function takeSnapshot() {
            const video = document.getElementById('webcam');
            if (!stream) {
                logMsg('エラー: カメラが起動していません。');
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const link = document.createElement('a');
            link.download = `jarvis_snap_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            logMsg('キャプチャ画像を保存しました。');
        }

        // --- Speech Output (TTS) ---
        function speakJARVIS(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const uttr = new SpeechSynthesisUtterance(text);
                uttr.lang = 'ja-JP';
                uttr.rate = 1.0;
                uttr.pitch = 0.9;
                window.speechSynthesis.speak(uttr);
            }
        }

        // --- Voice Recognition Subsystem ---
        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                logMsg(`[音声入力]: ${transcript}`);
                processVoiceCommand(transcript);
            };

            recognition.onerror = (e) => {
                logMsg('音声認識エラー: ' + e.error);
            };

            recognition.onend = () => {
                if (isListening) recognition.start();
            };
        }

        function toggleVoiceRecognition() {
            if (!recognition) {
                alert('お使いのブラウザは音声認識をサポートしていません。');
                return;
            }
            const btn = document.getElementById('voice-btn');
            if (!isListening) {
                isListening = true;
                recognition.start();
                btn.innerText = '音声認識 停止';
                btn.style.background = '#00ffaa';
                btn.style.color = '#000';
                logMsg('音声認識を開始しました。');
            } else {
                isListening = false;
                recognition.stop();
                btn.innerText = '音声認識 開始';
                btn.style.background = '';
                btn.style.color = '';
                logMsg('音声認識を停止しました。');
            }
        }

        function processVoiceCommand(cmd) {
            if (cmd.includes('音楽') || cmd.includes('再生')) {
                playYT();
                speakJARVIS('音楽を再生します。');
            } else if (cmd.includes('停止') || cmd.includes('ストップ') || cmd.includes('止めて')) {
                pauseYT();
                speakJARVIS('再生を停止します。');
            } else if (cmd.includes('カメラ')) {
                startCamera();
                speakJARVIS('カメラを起動します。');
            } else if (cmd.includes('戦闘')) {
                toggleCombat();
            }
        }

        // --- YouTube Player API Integration ---
        let ytPlayer = null;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: '3L4YrGaR8E4',
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'rel': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('yt-status').innerText = 'READY';
            logMsg('YouTube Player API の準備が完了しました。');
        }

        function onPlayerStateChange(event) {
            const statusLabel = document.getElementById('yt-status');
            if (event.data === YT.PlayerState.PLAYING) {
                statusLabel.innerText = 'PLAYING';
                logMsg('YouTube: 再生中');
            } else if (event.data === YT.PlayerState.PAUSED) {
                statusLabel.innerText = 'PAUSED';
                logMsg('YouTube: 一時停止');
            } else if (event.data === YT.PlayerState.ENDED) {
                statusLabel.innerText = 'ENDED';
                logMsg('YouTube: 再生終了');
            }
        }

        function extractVideoId(input) {
            if (!input) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = input.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (input.length === 11 ? input : null);
        }

        function loadYouTubeVideo() {
            const input = document.getElementById('yt-url-input').value.trim();
            const videoId = extractVideoId(input);
            if (videoId && ytPlayer) {
                ytPlayer.loadVideoById(videoId);
                logMsg(`YouTube ID: ${videoId} を読み込みました。`);
            } else {
                alert('有効なYouTube URLまたは動画IDを入力してください。');
            }
        }

        function quickPlay(videoId) {
            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(videoId);
                logMsg(`BGM (ID: ${videoId}) を再生します。`);
            }
        }

        function playYT() {
            if (ytPlayer && ytPlayer.playVideo) {
                ytPlayer.playVideo();
            }
        }

        function pauseYT() {
            if (ytPlayer && ytPlayer.pauseVideo) {
                ytPlayer.pauseVideo();
            }
        }

        function stopYT() {
            if (ytPlayer && ytPlayer.stopVideo) {
                ytPlayer.stopVideo();
                logMsg('YouTube 再生を停止しました。');
            }
        }
    </script>
</body>
</html>
