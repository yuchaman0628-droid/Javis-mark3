<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. System Interface</title>
    <style>
        :root {
            --primary-color: #00f3ff;
            --bg-color: #050b14;
            --panel-bg: rgba(8, 20, 38, 0.85);
            --text-color: #e0f7fc;
            --border-color: #00f3ff;
            --user-bg: #121e2d;
            --error-color: #ff3366;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header h2 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h2::before {
            content: "●";
            font-size: 0.8rem;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .clear-btn:hover {
            background: var(--primary-color);
            color: var(--bg-color);
        }

        .chat-log {
            height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 10px;
            margin-bottom: 15px;
        }

        .chat-log::-webkit-scrollbar {
            width: 6px;
        }

        .chat-log::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            position: relative;
        }

        .message .meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 6px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .message.user {
            background-color: var(--user-bg);
            border-left: 3px solid var(--primary-color);
        }

        .message.jarvis {
            background-color: rgba(0, 243, 255, 0.05);
            border-left: 3px solid var(--primary-color);
        }

        .message.error {
            background-color: rgba(255, 51, 102, 0.1);
            border-left: 3px solid var(--error-color);
            border-color: var(--error-color);
            color: #ff99aa;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 4px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        button.send-btn {
            background: var(--primary-color);
            color: var(--bg-color);
            border: none;
            padding: 0 24px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.send-btn:hover {
            background: #80f9ff;
        }

        .api-key-container {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-key-container input {
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="api-key-container">
        <input type="password" id="apiKeyInput" placeholder="Gemini APIキーを入力してください (AIzaSy...)">
    </div>

    <div class="header">
        <h2>J.A.R.V.I.S. GEMINI LOG</h2>
        <button class="clear-btn" id="clearBtn">[CLEAR]</button>
    </div>

    <div class="chat-log" id="chatLog">
        <!-- ログ出力領域 -->
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="メッセージを入力... (例: 「こんにちは」)">
        <button class="send-btn" id="sendBtn">送信</button>
    </div>
</div>

<script>
    const chatLog = document.getElementById('chatLog');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');

    // ローカルストレージからAPIキーを復元
    if (localStorage.getItem('gemini_api_key')) {
        apiKeyInput.value = localStorage.getItem('gemini_api_key');
    }

    apiKeyInput.addEventListener('change', () => {
        localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    function getCurrentTime() {
        const now = new Date();
        return now.toTimeString().split(' ')[0];
    }

    function addMessage(sender, text, type = 'jarvis') {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;

        const metaDiv = document.createElement('div');
        metaDiv.className = 'meta';
        metaDiv.innerHTML = `<span>${sender}</span><span>${getCurrentTime()}</span>`;

        const textDiv = document.createElement('div');
        textDiv.className = 'content';
        textDiv.textContent = text;

        msgDiv.appendChild(metaDiv);
        msgDiv.appendChild(textDiv);
        chatLog.appendChild(msgDiv);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = apiKeyInput.value.trim();

        if (!text) return;
        if (!apiKey) {
            alert('APIキーを入力してください。');
            return;
        }

        addMessage('USER', text, 'user');
        userInput.value = '';

        // 修正ポイント：最新推奨モデル endpoint (gemini-2.5-flash) を使用
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: text }]
                    }]
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || `HTTP error! status: ${response.status}`);
            }

            const botReply = data.candidates[0].content.parts[0].text;
            addMessage('J.A.R.V.I.S. (GEMINI)', botReply, 'jarvis');

        } catch (error) {
            addMessage('J.A.R.V.I.S. (GEMINI)', `エラーが発生しました: ${error.message}`, 'error');
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    clearBtn.addEventListener('click', () => {
        chatLog.innerHTML = '';
    });
</script>

</body>
</html>
